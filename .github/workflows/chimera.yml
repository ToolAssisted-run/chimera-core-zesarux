name: chimera waterbox core

# Builds the core from a fresh clone, tests it, and publishes the package.
#
# NOT RUN YET: this repository has no remote. Written from the Fuse core's
# workflow on 2026-10-31.
#
# The tests read the Next's boot ROM, the 48K ROM and the SD card image from
# the ZEsarUX submodule (ZEsarUX's repository carries them), and make their
# own test program, so every test of the test script runs here: the native
# build against the sandbox, savestates, input, the program on the SD card,
# the package in Chimera's headless runner and in its window, and Chimera's
# own checks of the package. A public runner may read those three files
# (user-decided, 2026-10-31: docs/PLAN.md).

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      kind:
        description: 'dev (rolling) or nightly (dated). Blank means dev.'
        required: false
        default: ''
        type: string
  schedule:
    # 05:25 UTC. A nightly is published only when main moved since the last
    # one; the shared publishing workflow checks.
    - cron: '25 5 * * *'

# Keyed by the event as well as the branch: otherwise the nightly schedule
# and a push to main cancel each other, and the publishing that depends on
# the cancelled run is skipped with nothing reporting a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  gate:
    name: build and test (native against sandbox, the package, Chimera's package checks)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Install build dependencies
        # The lib*-dev packages are what Chimera's own build needs; this core
        # links none of them.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential cmake pkg-config python3 libgl1-mesa-dev libegl-dev libx11-dev libxext-dev libasound2-dev

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-6.12.0-linux-aqt-3.3.0

      - name: Build Chimera (the engine, chimera-run and the window)
        run: chimera-checkout/tools/ci-chimera.sh "$HOME/qt"

      - name: Cache miniBox's sandbox toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (the sandbox, and its C++ toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build the native reference and the sandbox runner
        run: |
          meson setup build/meson-native -Dminibox_dir="$PWD/chimera-checkout/extern/chimera-common-minibox"
          ninja -C build/meson-native

      - name: Build the sandboxed core and the package
        # The commit is the version the package is stamped with: this is the
        # build that is published, so it is what a movie can name. A package
        # built by hand is stamped "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
        run: sh ./waterbox/build-package.sh -o build/pkg -m "$GITHUB_WORKSPACE/chimera-checkout/extern/chimera-common-minibox"

      - name: Run the test script
        # A run in which a test did not pass has tested nothing, so each is
        # asked for by name.
        env:
          CHIMERA_ROOT: ${{ github.workspace }}/chimera-checkout
        run: |
          rc=0
          sh ./waterbox/run-gate.sh > gate.out 2>&1 || rc=$?
          cat gate.out
          [ "$rc" -eq 0 ]
          for t in boot:fast rom:built-in boot:nextzxos time:virtual state:every-frame state:other-process \
                   input:buttons input:reset next:hardware program:sd-card game:warhawk settings:refused \
                   frontend:picture frontend:states frontend:movie frontend:firmware frontend:suggest \
                   frontend:built-in-rom; do
            grep -q "^$t  *PASS " gate.out || { echo "$t did not pass"; exit 1; }
          done

      - name: Run the window test
        # The package loaded by Chimera's own window (run headless,
        # with no display): the machine's memory against the native build's,
        # a setting, and the keys.
        # Qt is where the step that built Chimera put it
        run: QT_LIB_DIR="$HOME/qt/6.12.0/gcc_64/lib" bash ./waterbox/tests/run-frontend.sh --chimera-root "$GITHUB_WORKSPACE/chimera-checkout"

      - name: Chimera's checks of the package
        run: chimera-checkout/build/meson-linux/source/ui/test-packages build/pkg

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: zesarux-${{ github.sha }}
          path: build/pkg/zesarux.chimeraCore
          if-no-files-found: error

      - name: Upload the test output on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: gate.out

  publish:
    # What passed above, published as this core's own release: a rolling `dev`
    # on every push to main, a dated `nightly-YYYY-MM-DD` from the scheduled
    # run, through the one workflow every Chimera core publishes with.
    name: publish
    needs: [ gate ]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: zesarux
      artifact: zesarux-${{ github.sha }}
      package: zesarux.chimeraCore
      kind: ${{ github.event.inputs.kind }}
